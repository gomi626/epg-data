name: probe-nhk-v3
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe radio
        env:
          K: ${{ secrets.NHK_API_KEY }}
        run: |
          D=$(TZ=Asia/Tokyo date +%F)
          for S in r1 r3; do
            for E in papiPgDateRadio papiPgDateTv; do
              C=$(curl -s -m 30 -o r.json -w '%{http_code}' "https://program-api.nhk.jp/v3/$E?service=$S&area=130&date=$D&key=$K")
              python3 - "$C" "$E" "$S" <<'PY'
          import json,sys
          c,e,s=sys.argv[1:]
          try: d=json.load(open("r.json"))
          except Exception: print(f"::notice::{c} {e} {s} non-json "+open("r.json").read()[:200].replace("\n"," ")); sys.exit()
          g=d.get(s) or {}
          pubs=g.get("publication") or []
          pon=(g.get("publishedOn") or [{}])[0]
          print(f"::notice::{c} {e} {s} keys={list(d)[:5]} n={len(pubs)} name={pon.get('name')} disp={pon.get('broadcastDisplayName')}")
          if pubs:
              p=pubs[0]; print(f"::notice::{e} {s} P0 keys={list(p)} ig={list((p.get('identifierGroup') or {}))} misc={list((p.get('misc') or {}))} sample="+json.dumps({k:p.get(k) for k in ('id','name','description','startDate','endDate')},ensure_ascii=False)[:600])
          elif c!="200": print(f"::notice::{e} {s} body="+json.dumps(d,ensure_ascii=False)[:300])
          PY
            done
          done
