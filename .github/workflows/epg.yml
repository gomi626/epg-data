name: Update NHK G Yamagata EPG

on:
  schedule:
    # 매일 05:17 JST (= 20:17 UTC). 정각은 GitHub 스케줄이 몰려 지연되기 쉬워 17분으로 설정
    - cron: "17 20 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate EPG
        env:
          NHK_API_KEY: ${{ secrets.NHK_API_KEY }}
        run: python epg.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nhk_g1_yamagata.xml
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "Update EPG $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          fi
